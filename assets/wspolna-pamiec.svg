<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img" aria-label="Wbudowane pamieci sa zamkniete w obrebie narzedzia, memspec daje jeden magazyn wspolny dla Claude Code i Codex">
  <style>
    .tool { font: 600 14px Inter, system-ui, sans-serif; fill: var(--fg); }
    .path { font: 600 12px "JetBrains Mono", monospace; fill: var(--accent); }
    .note { font: 400 12px Inter, system-ui, sans-serif; fill: var(--fg-dim); }
    .cap  { font: 700 12px Inter, system-ui, sans-serif; fill: var(--accent-soft); }
    .x    { font: 700 15px Inter, system-ui, sans-serif; fill: var(--fg-dim); }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--accent)"/>
    </marker>
  </defs>

  <!-- ============ LEWA: wbudowane, zamkniete ============ -->
  <text x="20" y="26" class="cap">WBUDOWANA PAMIĘĆ - dwa osobne światy</text>

  <g>
    <rect x="20" y="42" width="180" height="60" rx="8" fill="var(--surface)" stroke="var(--accent)" stroke-width="1.5"/>
    <text x="110" y="66" class="tool" text-anchor="middle">Claude Code</text>
    <text x="110" y="87" class="path" text-anchor="middle">projects/*/memory/</text>
  </g>

  <g>
    <rect x="20" y="130" width="180" height="60" rx="8" fill="var(--surface)" stroke="var(--accent)" stroke-width="1.5"/>
    <text x="110" y="154" class="tool" text-anchor="middle">Codex</text>
    <text x="110" y="175" class="path" text-anchor="middle">~/.codex/memories/</text>
  </g>

  <!-- przekreslone polaczenie miedzy nimi -->
  <path d="M215 72 L275 72" stroke="var(--fg-dim)" stroke-width="2" stroke-dasharray="5 4"/>
  <path d="M215 160 L275 160" stroke="var(--fg-dim)" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="252" y="120" class="x" text-anchor="middle">✕</text>
  <text x="300" y="112" class="note">nie widzą się</text>
  <text x="300" y="132" class="note">nawzajem</text>

  <!-- ============ PRAWA: memspec, wspolny ============ -->
  <text x="480" y="26" class="cap">MEMSPEC - jeden magazyn</text>

  <g>
    <rect x="480" y="42" width="150" height="52" rx="8" fill="var(--surface)" stroke="var(--accent)" stroke-width="1.5"/>
    <text x="555" y="74" class="tool" text-anchor="middle">Claude Code</text>
  </g>

  <g>
    <rect x="480" y="138" width="150" height="52" rx="8" fill="var(--surface)" stroke="var(--accent)" stroke-width="1.5"/>
    <text x="555" y="170" class="tool" text-anchor="middle">Codex</text>
  </g>

  <!-- strzalki dwukierunkowe do magazynu -->
  <path d="M636 68 L706 104" stroke="var(--accent)" stroke-width="2" marker-end="url(#a)"/>
  <path d="M636 164 L706 128" stroke="var(--accent)" stroke-width="2" marker-end="url(#a)"/>
  <text x="662" y="60" class="note" text-anchor="middle">MCP</text>
  <text x="662" y="192" class="note" text-anchor="middle">MCP</text>

  <!-- magazyn -->
  <g>
    <rect x="712" y="82" width="168" height="68" rx="10" fill="var(--surface)" stroke="var(--accent)" stroke-width="2.5"/>
    <text x="796" y="108" class="path" text-anchor="middle">.memspec/</text>
    <text x="796" y="130" class="note" text-anchor="middle">markdown w repo</text>
  </g>

  <!-- warunki -->
  <text x="480" y="232" class="note">· ten sam</text>
  <text x="543" y="232" class="path">--cwd</text>
  <text x="588" y="232" class="note">w obu konfiguracjach</text>
  <text x="480" y="256" class="note">· brak usługi w tle - konflikty rozwiązuje git</text>
  <text x="480" y="280" class="note">· fakt zapisany przez jednego jest widoczny dla drugiego</text>

  <text x="20" y="232" class="note">Każdy agent uczy się</text>
  <text x="20" y="252" class="note">osobno i od zera.</text>
  <text x="20" y="276" class="note">Ten sam fakt trzeba</text>
  <text x="20" y="296" class="note">tłumaczyć dwa razy.</text>
</svg>
