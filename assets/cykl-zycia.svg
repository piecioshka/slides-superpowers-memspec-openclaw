<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-label="Cykl zycia rekordu memspec: active, superseded, retired oraz wykrywanie dryfu kotwicy">
  <style>
    .st   { font: 700 15px "JetBrains Mono", monospace; fill: var(--on-accent); }
    .note { font: 400 12.5px Inter, system-ui, sans-serif; fill: var(--fg-dim); }
    .hl   { font: 600 13px Inter, system-ui, sans-serif; fill: var(--fg); }
    .code { font: 400 12px "JetBrains Mono", monospace; fill: var(--accent-soft); }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--accent)"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--fg-dim)"/>
    </marker>
  </defs>

  <!-- stany -->
  <rect x="40" y="40" width="150" height="46" rx="23" fill="var(--accent)"/>
  <text x="115" y="69" class="st" text-anchor="middle">active</text>

  <rect x="375" y="40" width="150" height="46" rx="23" fill="var(--accent-soft)"/>
  <text x="450" y="69" class="st" text-anchor="middle">superseded</text>

  <rect x="710" y="40" width="150" height="46" rx="23" fill="var(--muted)"/>
  <text x="785" y="69" class="st" text-anchor="middle">retired</text>

  <path d="M190 63 L368 63" stroke="var(--accent)" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M525 63 L703 63" stroke="var(--fg-dim)" stroke-width="2" marker-end="url(#ag)"/>

  <text x="279" y="52" class="note" text-anchor="middle">zastąpiony nowym</text>
  <text x="614" y="52" class="note" text-anchor="middle">wycofany</text>

  <!-- co wyzwala przejscie -->
  <rect x="40" y="120" width="480" height="98" rx="10" fill="var(--surface)" stroke="var(--accent)" stroke-width="1.5"/>
  <text x="62" y="148" class="hl">Co wyzwala zmianę stanu</text>
  <text x="62" y="172" class="note">Kod się zmienił, więc SHA kotwicy nie zgadza się z repo:</text>
  <text x="62" y="194" class="code">memspec reconcile</text>
  <text x="62" y="212" class="note">Rekord zostaje oznaczony jako podejrzany - nie skasowany.</text>

  <!-- nowy rekord -->
  <rect x="545" y="120" width="315" height="98" rx="10" fill="var(--surface)" stroke="var(--accent-soft)" stroke-width="1.5"/>
  <text x="567" y="148" class="hl">Poprawka = NOWY rekord</text>
  <text x="567" y="172" class="code">supersedes: ms_01M2X1NA0X...</text>
  <text x="567" y="194" class="note">Stary ląduje w archive/, historia</text>
  <text x="567" y="212" class="note">zostaje nienaruszona.</text>

  <path d="M450 120 L450 100" stroke="var(--accent-soft)" stroke-width="2"/>
  <path d="M640 120 L640 92" stroke="var(--accent-soft)" stroke-width="2" marker-end="url(#ar)" transform="rotate(180 640 106)"/>

  <!-- sila dowodu -->
  <rect x="40" y="244" width="820" height="62" rx="10" fill="var(--bg)" stroke="var(--line)"/>
  <text x="62" y="270" class="hl">Siła dowodu w polu verified_with</text>
  <text x="62" y="293" class="code">anchor</text>
  <text x="128" y="293" class="note">SHA pliku  &gt;</text>
  <text x="225" y="293" class="code">operator</text>
  <text x="300" y="293" class="note">powiedział człowiek  &gt;</text>
  <text x="455" y="293" class="code">evidence</text>
  <text x="530" y="293" class="note">dołączony dowód  &gt;</text>
  <text x="655" y="293" class="code">assertion</text>
  <text x="735" y="293" class="note">model tak twierdzi</text>
</svg>
